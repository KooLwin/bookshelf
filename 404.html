<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #eef2f7, #d9e0eb);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .redirect-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .redirect-card .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        .redirect-card h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 8px;
        }
        .redirect-card p {
            color: #5b5b60;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .redirect-card .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e8ecf1;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-card .btn-manual {
            display: inline-block;
            padding: 12px 28px;
            background: #007aff;
            color: white;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .redirect-card .btn-manual:active {
            transform: scale(0.96);
        }
        .redirect-card .note {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <span class="icon">🔄</span>
        <h1>Redirecting...</h1>
        <p>You are being redirected to the <strong>Kreative Bookshelf</strong> homepage.</p>
        <div class="spinner"></div>
        <p style="font-size:13px; color:#6c7a8e; margin-top:4px;">
            If you are not redirected automatically, click the button below.
        </p>
        <a href="/" class="btn-manual">🏠 Go to Homepage</a>
        <div class="note">✨ Kreative Kid's Lab © 2026</div>
    </div>

    <script>
        (function() {
            // Get the current path
            const path = window.location.pathname;
            const isFree = path.includes('free.html');
            const isPremium = path.includes('premium.html');
            
            // Check if user is logged in
            let isUserPremium = false;
            let userData = null;
            let isLoggedIn = false;
            
            try {
                const user = localStorage.getItem('kreative_user');
                const loginTime = parseInt(localStorage.getItem('kreative_login_time'), 10);
                const sessionDuration = 24 * 60 * 60 * 1000;
                
                if (user && loginTime && (Date.now() - loginTime <= sessionDuration)) {
                    userData = JSON.parse(user);
                    isLoggedIn = true;
                    isUserPremium = userData.isPremium === true;
                }
            } catch(e) {
                console.warn('Error reading user data:', e);
            }
            
            // Determine where to redirect
            let redirectUrl = '/';
            
            if (isFree) {
                // If user is premium, redirect to premium
                if (isLoggedIn && isUserPremium) {
                    redirectUrl = '/?plan=premium';
                } else {
                    redirectUrl = '/?plan=free';
                }
            } else if (isPremium) {
                // If user is not premium, redirect to free
                if (isLoggedIn && isUserPremium) {
                    redirectUrl = '/?plan=premium';
                } else {
                    redirectUrl = '/?plan=free';
                }
            }
            
            // Also check URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const planParam = urlParams.get('plan');
            
            // If plan parameter exists, use it
            if (planParam) {
                redirectUrl = '/?plan=' + planParam;
            }
            
            console.log('🔄 Redirecting to:', redirectUrl);
            
            // Redirect after 1.5 seconds
            setTimeout(function() {
                window.location.href = redirectUrl;
            }, 1500);
            
            // Also redirect immediately when user clicks anywhere
            document.addEventListener('click', function() {
                window.location.href = redirectUrl;
            });
            
            // Handle back/forward navigation
            window.addEventListener('popstate', function() {
                window.location.href = redirectUrl;
            });
            
        })();
    </script>
</body>
</html>
